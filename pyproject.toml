[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tgscraper"
version = "0.2.0"
description = "Scrape public Telegram channel previews without API keys"
authors = [
    { name = "Anton", email = "anton@users.noreply.github.com" }
]
dependencies = [
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "prometheus-client>=0.17.0",
]
requires-python = ">=3.10"

[project.scripts]
tgscraper = "tgscraper.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
